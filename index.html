<style>
/* Layout idea: a professor-style homepage. A fixed profile column on the left (photo, name, links),
   a reading column on the right. A faint routing-grid in the profile panel nods to chip layouts. */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --ink: #141A24;
  --muted: #5A6475;
  --line: #DDE1E8;
  --accent: #2346C7;        /* signal blue: links, highlights */
  --accent-soft: #E7ECFB;
  --copper: #A85B23;        /* chip-trace copper: small numeric highlights only */
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1219; --surface: #151B25; --ink: #E7EAF0; --muted: #9AA4B5; --line: #263042;
    --accent: #8EA6FF; --accent-soft: #1C2742; --copper: #E09A5F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1219; --surface: #151B25; --ink: #E7EAF0; --muted: #9AA4B5; --line: #263042;
  --accent: #8EA6FF; --accent-soft: #1C2742; --copper: #E09A5F; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
img { max-width: 100%; display: block; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; display: grid; grid-template-columns: 300px 1fr; gap: 48px; align-items: start; }

/* ---------- profile column ---------- */
.profile { position: sticky; top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.profile .grid { height: 72px; background-color: var(--accent-soft);

.profile .inner { padding: 0 22px 22px; }
.photo { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; border: 4px solid var(--surface); margin-top: -58px; background: var(--line); }
.name { font-family: var(--display); font-weight: 600; font-size: 1.62rem; line-height: 1.15; margin: 12px 0 4px; text-wrap: balance; }
.role { color: var(--muted); font-size: .93rem; margin: 0; }
.status { display: inline-flex; gap: 8px; align-items: center; margin: 14px 0 4px; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 500; }

/* ---------- main column ---------- */
main { min-width: 0; }
section { padding: 8px 0 34px; border-bottom: 1px solid var(--line); margin-bottom: 30px; }
section:last-child { border-bottom: none; }
h2 { font-family: var(--display); font-weight: 600; font-size: 1.55rem; margin: 0 0 14px; text-wrap: balance; }

.news .d { font-family: var(--mono); font-size: .82rem; color: var(--muted); padding-top: 2px; }

.project figure img { border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.project figcaption { font-size: .78rem; color: var(--muted); margin-top: 6px; }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.metric { border-left: 2px solid var(--copper); padding: 2px 0 2px 10px; }
.metric b { display: block; font-family: var(--mono); font-size: 1.2rem; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.metric span { font-size: .78rem; color: var(--muted); line-height: 1.35; display: block; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; padding: 0; list-style: none; }
.tags li { font-family: var(--mono); font-size: .72rem; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
.plinks { display: flex; flex-wrap: wrap; gap: 14px; font-size: .9rem; font-weight: 500; }

.rows { display: grid; gap: 16px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; }
.row .t { font-weight: 600; }
.row .when { font-family: var(--mono); font-size: .82rem; color: var(--muted); text-align: right; }

.skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.skills ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: .93rem; }
.learning { font-family: var(--mono); font-size: .68rem; color: var(--copper); margin-left: 6px; }

footer { color: var(--muted); font-size: .82rem; }

@media (max-width: 900px) {

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
const linkOr = (url, text, reminder) => url ? `<a href="${esc(url)}">${text}</a>` : `<span class="todo">${reminder}</span>`;

function renderProfile(s) {
  const host = u => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  return `
    <div class="grid" aria-hidden="true"></div>
    <div class="inner">
      <img class="photo" src="${esc(s.photo)}" alt="Portrait of ${esc(s.name)}" width="132" height="132">
      <h1 class="name">${esc(s.name)}</h1>
      <p class="role">${esc(s.role)}</p>
      ${s.status ? `<div class="status">${esc(s.status)}</div>` : ""}
      <ul class="links">
        <li><span class="k">Email</span><span class="v">${s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email).replace("@", "@<wbr>")}</a>` : `<span class="todo">add your email</span>`}</span></li>
        <li><span class="k">GitHub</span><span class="v">${linkOr(s.github, s.github ? esc(host(s.github)) : "", "add GitHub")}</span></li>
        <li><span class="k">LinkedIn</span><span class="v">${linkOr(s.linkedin, "View profile", "add your LinkedIn link")}</span></li>
        ${s.scholar ? `<li><span class="k">Scholar</span><span class="v"><a href="${esc(s.scholar)}">Google Scholar</a></span></li>` : ""}
        <li><span class="k">Based</span><span class="v">${esc(s.location)}</span></li>
      </ul>
      ${s.cv ? `<a class="cv" href="${esc(s.cv)}" target="_blank" rel="noopener">Download CV (PDF)</a>` : `<span class="cv" style="opacity:.55">CV coming soon</span>`}
    </div>`;
}

    </article>`).join("")}</section>`);

  out.push(`<section id="education"><h2>Education</h2><div class="rows">${

  out.push(`<section id="skills"><h2>Skills</h2><div class="skills">${

    <footer>© ${new Date().getFullYear()} ${esc(s.name)} · Last updated November 2026</footer></section>`);
  return out.join("");
}
